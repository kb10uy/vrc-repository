name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages

env:
  HUGO_VERSION: 0.162.1

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache/restore@v4
        with:
          path: cache/index.json
          key: listing-${{ github.run_id }}
          restore-keys: listing-

      - name: Build the listing
        uses: kb10uy/vpmrepo-neobuilder@v0.1.0
        with:
          source: source.toml
          index: static/index.json
          data: data/listing.json
          cache: cache/index.json

      - name: Refresh the cache
        run: |
          mkdir -p cache
          cp static/index.json cache/index.json

      - uses: actions/cache/save@v4
        with:
          path: cache/index.json
          key: listing-${{ github.run_id }}

      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Hugo
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --output hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - name: Build the site
        run: hugo --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
